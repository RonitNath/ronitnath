claims:
  - id: d1-the-credential-decides-1
    statement: |
      The current public-agent API lets any credential with `call:originate` choose either production or test execution and overwrite both `trigger_mode` and `service_principal_*` attribution, making the promised cost split and caller identity forgeable.
    provenance:
      - EV-013
      - api/routes/public_agent.py:232-250
      - api/routes/public_agent.py:394-459
      - api/services/auth/scopes.py:15-24
      - api/db/models.py:565-623
    stake: true
    note: |
      All four production and test routes require the same `CALL_ORIGINATE` scope, and the route path selects `use_draft`; the credential carries no production-versus-agent-test authority. Worse, the implementation writes `trigger_mode` and the verified principal fields into `initial_context` and then applies caller-controlled `request.initial_context`, allowing those reserved keys to be replaced. `WorkflowRunModel` has no typed principal or cost-class column, so the overwritten JSON is the durable record available to the cost split.

  - id: d1-the-credential-decides-2
    statement: |
      Audgent satisfies the credential-decides rule only when each registered machine principal has a server-managed `production-product` or `worker-agent` class and every run copies that class and principal id into non-client-writable columns.
    provenance:
      - EV-006
      - EV-011
      - EV-013
      - EV-017
      - decisions/DEC-001-degenerate-tenancy.md
      - api/db/models.py:192-244
      - api/services/auth/service_principal.py:176-200
    stake: false
    note: |
      EV-017 assigns credentials to products, while EV-006 and EV-011 identify worker agents as the other machine actor. The existing verifier already resolves an issuer-authenticated `client_id` to a unique local principal with scopes, but the model classifies principals only as tenant or fleet; after degeneration every ordinary caller is the same tenant kind. A credential-owned caller class supplies both attribution and the production-versus-agent-test cost class without accepting either value from the request.

  - id: d1-the-credential-decides-3
    statement: |
      A production-product credential must be unable to invoke test execution or mutate workflows or providers, while a worker-agent credential must be unable to originate a production run, regardless of endpoint or payload.
    provenance:
      - EV-011
      - EV-012
      - EV-013
      - EV-017
      - flows/FLOWS-001-internal-reshaping.md
      - api/services/auth/scopes.py:15-43
      - api/routes/public_agent.py:394-459
    stake: false
    note: |
      F-7 assigns workflow creation and testing to agents, F-8 assigns provider configuration and testing to agents, and F-9 says rinity production status follows from its product key. The current scope vocabulary has one undifferentiated `call:originate` grant, and both production and test routes accept it. Separate credential grants for production origination and agent-test origination, enforced after principal verification, make crossing the boundary an authorization failure rather than a caller convention.

  - id: d1-the-credential-decides-4
    statement: |
      Every run-admission path must reject a request unless its authenticated credential resolves to exactly one actor and one cost class, so no newly created run can enter an unattributed cost bucket.
    provenance:
      - EV-013
      - flows/FLOWS-001-internal-reshaping.md
      - api/services/auth/service_principal.py:176-200
      - api/services/auth/service_principal.py:241-256
    stake: false
    note: |
      F-3 requires visible legacy unattributed data, but EV-013 requires attribution for every new run and cost rollup. The existing service-principal verifier already rejects active issuer tokens whose client is not registered, and route dependencies reject missing scopes. Extending that fail-closed admission rule to credential-owned actor and cost classes prevents silent defaulting and removes caller discipline from the accounting boundary.

  - id: d1-the-credential-decides-5
    statement: |
      Each worker agent must use its own credential, and every workflow or configuration mutation must persist that principal id in an append-only change record populated by the server.
    provenance:
      - EV-014
      - EV-028
      - EV-029
      - flows/FLOWS-001-internal-reshaping.md
      - api/db/models.py:472-489
      - api/routes/workflow.py:422-468
    stake: false
    note: |
      F-5 requires the owner to see which agent changed what, and EV-029 establishes that provider configuration is mutated in place with no history. The machine workflow-create path passes `caller.user_id`, which is `None` for a service principal, into a model that has only a user ownership field, so even the existing machine-authenticated authoring seam drops the principal identity at persistence. Distinct worker credentials plus server-stamped principal foreign keys make authorship follow mechanically from the key and preserve it through later credential rotation or renaming.

  - id: d1-the-credential-decides-6
    statement: |
      Provider configuration and provider testing are not agent-authorizable in the current code because their routes accept operator sessions rather than service principals with credential-bound scopes.
    provenance:
      - EV-011
      - EV-012
      - EV-025
      - api/services/auth/scopes.py:15-24
      - api/routes/organization.py:279-339
      - api/routes/organization.py:527-663
    stake: false
    note: |
      `CONFIG_WRITE` exists in the machine scope vocabulary, but the model-configuration and telephony-provider configuration routes depend on `get_user`, not `require_caller(CONFIG_WRITE)`, and there is no credential-gated provider-test verb in those route families. Thus the key cannot currently grant an agent the exact configure-and-test authority the owner assigned it. Moving those machine operations behind principal verification and narrow scopes makes permission a property of the credential rather than of an operator-only route.

  - id: d1-the-credential-decides-7
    statement: |
      Collapsing audgent to one organization does not collapse credentials: rinity and every worker agent remain distinct principals whose permissions, attribution, and revocation are determined by their own keys.
    provenance:
      - EV-017
      - EV-030
      - decisions/DEC-001-degenerate-tenancy.md
      - api/db/models.py:192-244
      - api/db/service_principal_client.py:13-30
      - api/db/service_principal_client.py:87-96
    stake: false
    note: |
      DEC-001 explicitly says keys identify products rather than tenants and resolve the constant organization implicitly. The existing principal table uniquely keys issuer plus client id, stores per-principal scopes and active state, and supports deactivation, so one-org degeneration removes tenant choice without removing caller identity. A shared one-org credential would erase the product-versus-worker distinction, agent-level activity history, least privilege, and independent revocation in one move.
