    value from the request.

    '
  rebuts:
  - D2-1
  resolution: resolved
  note_judge: 'SYNTHESIS, and the two ends agree more than they disagree. Cost class and actor are DERIVED
    from the credential (D1: unforgeable, zero discipline) and STAMPED IMMUTABLY on the run at creation
    in non-client-writable columns (D2: survives key rotation and reuse). D2-4 additionally wins on its
    own: purpose (workflow-test / provider-test / production) is distinct from cost class and both are
    needed.

    '
- id: D1-3
  author: d1-the-credential-decides
  statement: 'A production-product credential must be unable to invoke test execution or mutate workflows
    or providers, while a worker-agent credential must be unable to originate a production run, regardless
    of endpoint or payload.

    '
  provenance:
  - EV-011
  - EV-012
  - EV-013
  - EV-017
  - flows/FLOWS-001-internal-reshaping.md
  - api/services/auth/scopes.py:15-43
  - api/routes/public_agent.py:394-459
  stake: false
  note: 'F-7 assigns workflow creation and testing to agents, F-8 assigns provider configuration and testing
    to agents, and F-9 says rinity production status follows from its product key. The current scope vocabulary
    has one undifferentiated `call:originate` grant, and both production and test routes accept it. Separate
    credential grants for production origination and agent-test origination, enforced after principal
    verification, make crossing the boundary an authorization failure rather than a caller convention.

    '
- id: D1-4
  author: d1-the-credential-decides
  statement: 'Every run-admission path must reject a request unless its authenticated credential resolves
    to exactly one actor and one cost class, so no newly created run can enter an unattributed cost bucket.

    '
  provenance:
  - EV-013
  - flows/FLOWS-001-internal-reshaping.md
  - api/services/auth/service_principal.py:176-200
  - api/services/auth/service_principal.py:241-256
  stake: false
  note: 'F-3 requires visible legacy unattributed data, but EV-013 requires attribution for every new
    run and cost rollup. The existing service-principal verifier already rejects active issuer tokens
    whose client is not registered, and route dependencies reject missing scopes. Extending that fail-closed
    admission rule to credential-owned actor and cost classes prevents silent defaulting and removes caller
    discipline from the accounting boundary.

    '
- id: D1-5
  author: d1-the-credential-decides
  statement: 'Each worker agent must use its own credential, and every workflow or configuration mutation
    must persist that principal id in an append-only change record populated by the server.

    '
  provenance:
  - EV-014
  - EV-028
  - EV-029
  - flows/FLOWS-001-internal-reshaping.md
  - api/db/models.py:472-489
  - api/routes/workflow.py:422-468
  stake: false
  note: 'F-5 requires the owner to see which agent changed what, and EV-029 establishes that provider
    configuration is mutated in place with no history. The machine workflow-create path passes `caller.user_id`,
    which is `None` for a service principal, into a model that has only a user ownership field, so even
    the existing machine-authenticated authoring seam drops the principal identity at persistence. Distinct
    worker credentials plus server-stamped principal foreign keys make authorship follow mechanically
    from the key and preserve it through later credential rotation or renaming.

    '
- id: D1-6
  author: d1-the-credential-decides
  statement: 'Provider configuration and provider testing are not agent-authorizable in the current code
    because their routes accept operator sessions rather than service principals with credential-bound
    scopes.

    '
  provenance:
  - EV-011
  - EV-012
  - EV-025
  - api/services/auth/scopes.py:15-24
  - api/routes/organization.py:279-339
  - api/routes/organization.py:527-663
  stake: false
  note: '`CONFIG_WRITE` exists in the machine scope vocabulary, but the model-configuration and telephony-provider
    configuration routes depend on `get_user`, not `require_caller(CONFIG_WRITE)`, and there is no credential-gated
    provider-test verb in those route families. Thus the key cannot currently grant an agent the exact
    configure-and-test authority the owner assigned it. Moving those machine operations behind principal
    verification and narrow scopes makes permission a property of the credential rather than of an operator-only
    route.

    '
- id: D1-7
  author: d1-the-credential-decides
  statement: 'Collapsing audgent to one organization does not collapse credentials: rinity and every worker
    agent remain distinct principals whose permissions, attribution, and revocation are determined by
    their own keys.

    '
  provenance:
  - EV-017
  - EV-030
  - decisions/DEC-001-degenerate-tenancy.md
  - api/db/models.py:192-244
  - api/db/service_principal_client.py:13-30
  - api/db/service_principal_client.py:87-96
  stake: false
  note: 'DEC-001 explicitly says keys identify products rather than tenants and resolve the constant organization
    implicitly. The existing principal table uniquely keys issuer plus client id, stores per-principal
    scopes and active state, and supports deactivation, so one-org degeneration removes tenant choice
    without removing caller identity. A shared one-org credential would erase the product-versus-worker
    distinction, agent-level activity history, least privilege, and independent revocation in one move.

    '
- id: D2-1
  author: d2-the-run-carries-its-own-truth
  statement: 'A six-month-old run can be assigned correctly to production or agent-test only when an immutable
    cost class is required on the run at creation rather than derived from the credential that originated
    it.

    '
  provenance:
  - EV-013
  - flows/FLOWS-001-internal-reshaping.md:79-96
  - api/routes/public_agent.py:393-459
  stake: true
  note: 'EV-013 makes the split a first-class run attribution problem, and F-3 requires costs to roll
    up without manual reconstruction. The same service principal dependency can invoke both the published
    endpoints and the test endpoints; those paths differ by `use_draft`, not by caller identity. A credential-derived
    answer therefore cannot reconstruct what a particular run was, especially after keys are shared, rotated,
    or repurposed.

    '
  rebuts:
  - D1-2
  resolution: resolved
  note_judge: 'See D1-2.

    '
- id: D2-2
  author: d2-the-run-carries-its-own-truth
  statement: 'The current `workflow_runs` schema has no required field for origin, purpose, or cost class,
    so a persisted run does not carry the minimum historical identity demanded by EV-013.

    '
  provenance:
  - EV-013
  - api/db/models.py:565-610
  - api/db/workflow_run_client.py:41-108
  stake: false
  note: '`WorkflowRunModel` persists workflow and definition references, provider-oriented `mode`, call
    direction, mutable JSON contexts, usage, and cost, but it has no origin, purpose, or production-versus-agent-test
    column. `create_workflow_run` likewise accepts none of those three facts and defaults its context
    dictionaries to empty. Definition pinning preserves what workflow ran; it does not preserve why the
    run existed or whose activity produced it.

    '
- id: D2-3
  author: d2-the-run-carries-its-own-truth
  statement: '`initial_context` cannot be the provenance ledger because a public caller can overwrite
    the system''s trigger mode and principal identifiers before insertion and later code can mutate the
    same JSON after creation.

    '
  provenance:
  - api/routes/public_agent.py:229-250
  - api/db/workflow_run_client.py:308-315
  - api/schemas/workflow.py:9-31
  stake: false
  note: 'The public route writes `trigger_mode`, `service_principal_id`, `service_principal_client_id`,
    and token id, then applies `initial_context.update(request.initial_context or {})`, giving caller
    data the final value for those keys. The update client later merges additional patches into `run.initial_context`.
    Historical attribution stored there is neither protected at creation nor immutable afterward, even
    though it is returned as if it were ordinary run context.

    '
- id: D2-4
  author: d2-the-run-carries-its-own-truth
  statement: 'A run needs a purpose distinct from its cost class because workflow testing, provider testing,
    and production calling are different purposes even when the first two share the agent-test cost class.

    '
  provenance:
  - EV-011
  - EV-013
  - EV-025
  - flows/FLOWS-001-internal-reshaping.md:165-203
  stake: false
  note: 'EV-011 separately requires agents to test workflows and test providers, while EV-013 groups their
    spend into agent-test. Recording only `agent-test` would make those two mandated activities indistinguishable;
    recording only a purpose would force cost reporting to reinterpret purpose names later. The run therefore
    needs both an immutable purpose such as workflow-test or provider-test and an independently immutable
    cost class.

    '
- id: D2-5
  author: d2-the-run-carries-its-own-truth
  statement: 'Current run creation paths cannot consistently answer which product, agent, and activity
    originated a run because only the public-agent path snapshots a service principal while the other
    seven creation sites record incompatible fragments or no actor at all.

    '
  provenance:
  - EV-010
  - EV-014
  - flows/FLOWS-001-internal-reshaping.md:40-48
  - flows/FLOWS-001-internal-reshaping.md:79-92
  - api/routes/public_agent.py:243-272
  - api/routes/workflow.py:1202-1244
  - api/routes/workflow_text_chat.py:167-205
  - api/routes/agent_stream.py:66-88
  - api/routes/telephony.py:175-205
  - api/routes/telephony.py:455-501
  - api/services/campaign/campaign_call_dispatcher.py:271-300
  - api/services/telephony/ari_manager.py:668-700
  stake: false
  note: 'F-1 requires the originating product, and F-3 requires drill-down by agent and activity. The
    eight direct creation sites cover public API calls, console runs, text tests, agent stream, outbound
    and inbound telephony, campaigns, and ARI; only `public_agent.py` writes principal identifiers, and
    none requires an origin product plus activity identifier. One-org degeneration removes tenant context
    as a useful discriminator, making a run-owned origin snapshot mandatory for both credentialed and
    credentialless ingress.

    '
- id: D2-6
  author: d2-the-run-carries-its-own-truth
  statement: 'Any implementation that leaves origin, purpose, or cost class optional in the central run
    constructor will continue creating new unattributed runs through at least one ingress path.

    '
  provenance:
  - EV-013
  - flows/FLOWS-001-internal-reshaping.md:91-96
  - api/db/workflow_run_client.py:41-108
  - api/routes/public_agent.py:272-280
  - api/routes/telephony.py:475-501
  - api/services/campaign/campaign_call_dispatcher.py:288-300
  stake: false
  note: 'Run creation is shared by heterogeneous routes, and the current constructor enforces organization
    or user plus workflow existence but no provenance contract. Route-by-route conventions have already
    produced partial labels such as `trigger_mode`, `tester`, campaign ids, and inbound direction. The
    visible unattributed bucket in F-3 is necessary for pre-labelling history; accepting missing metadata
    for newly created runs would turn that migration state into an ongoing data-quality failure.

    '
- id: D2-7
  author: d2-the-run-carries-its-own-truth
  statement: 'Run-owned origin, purpose, and cost class will remain unusable for whole-system observability
    unless they are top-level response fields and filterable dimensions in both run listings and usage
    reports.

    '
  provenance:
  - EV-010
  - EV-014
  - flows/FLOWS-001-internal-reshaping.md:40-96
  - api/schemas/workflow.py:9-31
  - api/routes/platform_admin.py:38-69
  - api/db/organization_usage_client.py:133-151
  stake: false
  note: 'The current run response exposes generic contexts, mode, costs, and usage, while the platform-wide
    run projection exposes only mode and completion state. The usage endpoint''s filter allowlist omits
    product, agent, activity, purpose, and cost class. F-1 through F-3 require those dimensions to label
    live calls, reconstruct old calls, split spend, and drill down, so burying them in JSON would not
    produce the promised whole-system reads.

    '
- id: D2-8
  author: d2-the-run-carries-its-own-truth
  statement: 'Assigning provenance during completion processing will lose the truth for calls that fail
    before the pipeline completes, so origin, purpose, and cost class must exist before the first provider
    operation.

    '
  provenance:
  - EV-013
  - flows/FLOWS-001-internal-reshaping.md:52-57
  - api/services/pipecat/event_handlers.py:282-363
  - api/services/telephony/status_processor.py:190-231
  stake: false
  note: 'Normal pipeline usage is persisted at shutdown and completion work is then queued, while telephony
    status handling has a separate path for calls that never connect. F-1 explicitly requires an engine
    leg that dies mid-flight to remain visible rather than disappear. Creation-time classification is
    the only common point reached by successful, failed, canceled, and never-connected runs, and it lets
    later usage and cost records append to an identity that was already fixed.

    '
