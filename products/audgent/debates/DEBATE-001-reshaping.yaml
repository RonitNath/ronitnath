claims:
- id: A1-1
  author: a1-wire-or-nothing
  statement: 'Audgent as built cannot reconstruct from stored run evidence why a completed call claimed
    an appointment was booked when no appointment exists.

    '
  provenance:
  - EV-026
  - EV-029
  - api/services/workflow/tools/custom_tool.py:317
  - api/services/pipecat/tracing_config.py:146
  - api/services/pipecat/event_handlers.py:300
  stake: true
  note: 'The owner requires the actual provider and tool request/response sequence, not an inference from
    speech.  The tool path persists the model''s arguments and a transformed result but omits the resolved
    request, while provider exchanges exist only as optional exported spans and call events are saved
    only at finalization.  Those records cannot distinguish a rejected booking payload, a request sent
    to the wrong endpoint, a provider-side failure, and no request leaving audgent.

    '
- id: A1-2
  author: a1-wire-or-nothing
  statement: 'The HTTP-tool executor classifies every received HTTP response, including a 4xx or 5xx rejection,
    as a successful tool result returned to the voice agent.

    '
  provenance:
  - EV-026
  - api/services/workflow/tools/custom_tool.py:338
  - api/services/workflow/tools/custom_tool.py:352
  - api/services/workflow/tools/custom_tool.py:354
  - api/services/workflow/pipecat_engine_custom_tools.py:460
  stake: false
  note: '`execute_http_tool` does not raise on an error status: after any response it constructs `{"status":
    "success", "status_code": response.status_code, "data": ...}` and passes that object through the LLM
    result callback.  A booking endpoint''s schema rejection can therefore coexist with a success-labelled
    tool result and a spoken booking confirmation, making the exact response indispensable evidence.

    '
- id: A1-3
  author: a1-wire-or-nothing
  statement: 'A persisted function-call event cannot prove the booking request that crossed the wire because
    it records model arguments and a stringified result rather than the resolved method, URL, headers,
    query or body, and raw response.

    '
  provenance:
  - EV-026
  - EV-029
  - api/services/pipecat/realtime_feedback_events.py:72
  - api/services/pipecat/realtime_feedback_events.py:87
  - api/services/pipecat/realtime_feedback_events.py:91
  - api/services/workflow/tools/custom_tool.py:317
  - api/services/workflow/tools/custom_tool.py:323
  - api/services/workflow/tools/custom_tool.py:338
  - api/services/workflow/tools/custom_tool.py:348
  stake: false
  note: 'Preset and template parameters are merged only at execution, after the function-call-start event''s
    model arguments have been formed.  The final request is emitted through `httpx`, but only a DEBUG
    logger sees its body and parameters; the persisted end event converts the parsed result to Python
    `str()`.  Thus the stored run lacks both the exact outbound envelope and a verbatim inbound envelope.

    '
- id: A1-4
  author: a1-wire-or-nothing
  statement: 'Any call whose pipeline process exits before `on_pipeline_finished` can lose all accumulated
    transcript, tool, and error events even though those events already happened.

    '
  provenance:
  - FLOWS-001-internal-reshaping.md
  - api/services/pipecat/in_memory_buffers.py:102
  - api/services/pipecat/in_memory_buffers.py:107
  - api/services/pipecat/in_memory_buffers.py:152
  - api/services/pipecat/event_handlers.py:176
  - api/services/pipecat/event_handlers.py:300
  - api/services/pipecat/event_handlers.py:313
  stake: false
  note: '`InMemoryLogsBuffer` explicitly retains the call record in process memory and the database write
    occurs only in the pipeline-finished handler.  Even on that path, a failed log write is caught and
    reduced to another logger message after the run has already been marked completed at `api/services/pipecat/event_handlers.py:288`.  Durable
    evidence must be written as the call progresses, because the crash or persistence failure is itself
    one of the failures that must remain reconstructable.

    '
- id: A1-5
  author: a1-wire-or-nothing
  statement: 'A run pins a workflow definition but does not pin every mutable provider, tool, and credential
    value resolved at execution, so a later configuration edit can erase proof of the configuration that
    produced the call.

    '
  provenance:
  - EV-025
  - EV-029
  - api/db/models.py:248
  - api/db/models.py:256
  - api/db/models.py:565
  - api/db/models.py:571
  - api/db/models.py:1143
  - api/db/models.py:1200
  - api/services/configuration/ai_model_configuration.py:84
  - api/services/configuration/ai_model_configuration.py:98
  - api/services/workflow/pipecat_engine_custom_tools.py:249
  - api/services/workflow/tools/custom_tool.py:277
  stake: false
  note: 'Workflow versioning is real, but a workflow without a full model override resolves the current
    organization configuration at startup, and tool UUIDs resolve current `ToolModel` rows and current
    credential rows when invoked.  Those rows mutate in place.  Reconstruction therefore requires the
    run ledger to bind each exchange to the exact effective provider settings, tool definition, endpoint,
    and credential identity/version used at that moment rather than linking to today''s configuration.

    '
- id: A1-6
  author: a1-wire-or-nothing
  statement: 'A capture containing only completed request/response pairs cannot establish that no request
    was sent; the diagnostic record must durably record send intent before egress, response after ingress,
    monotonic sequence, correlation identifiers, and a terminal completeness marker.

    '
  provenance:
  - EV-026
  - EV-028
  - FLOWS-001-internal-reshaping.md
  - api/services/pipecat/realtime_feedback_events.py:97
  - api/services/pipecat/in_memory_buffers.py:161
  stake: false
  note: 'F-10 explicitly treats “no request was sent” as a different upstream cause, while F-11 requires
    an agent to query the same evidence.  Absence from an ordinary list is ambiguous between no egress,
    recorder failure, process death, and an unfinished write.  A before/after append protocol with an
    explicit closed ledger makes those cases mechanically distinguishable and preserves exact ordering
    across concurrent turns and tool calls.

    '
  rebuts:
  - A2-3
  resolution: resolved
  note_judge: 'SPLIT. Envelope metadata (method, URL, status, timing, sequence, correlation id, send-intent
    before egress, terminal completeness marker) is always-on and small; bodies are the part that carries
    cost and PHI and are governed by the retention/redaction policy OQ-8 must set. A1-6 wins on structure,
    A2 wins on bodies.

    '
- id: A1-7
  author: a1-wire-or-nothing
  statement: 'OTEL or Langfuse traces cannot serve as audgent''s authoritative diagnostic record because
    provider spans are silently dropped whenever no matching exporter is configured.

    '
  provenance:
  - EV-029
  - api/services/pipecat/tracing_config.py:146
  - api/services/pipecat/tracing_config.py:156
  - api/services/pipecat/tracing_config.py:167
  - api/services/pipecat/tracing_config.py:305
  - api/engine_settings.py:351
  stake: false
  note: 'The tracing setup deliberately permits a `None` default exporter and documents silent dropping,
    while `get_trace_url` returns nothing when Langfuse is disabled.  Optional exported telemetry therefore
    cannot satisfy happened-once reconstruction.  Exact provider STT, LLM, realtime, and TTS exchanges
    must land in the run''s own durable, queryable evidence record whether or not an external trace backend
    is active.

    '
- id: A1-8
  author: a1-wire-or-nothing
  statement: 'Final-webhook retries are not reconstructable attempt by attempt because each attempt overwrites
    one `last_status_code` and one truncated `last_error`, and a later success clears the prior error.

    '
  provenance:
  - EV-026
  - api/db/models.py:1046
  - api/db/models.py:1090
  - api/db/models.py:1111
  - api/db/models.py:1116
  - api/db/webhook_delivery_client.py:150
  - api/db/webhook_delivery_client.py:168
  - api/db/webhook_delivery_client.py:185
  - api/tasks/webhook_delivery.py:165
  - api/tasks/webhook_delivery.py:183
  stake: false
  note: 'The delivery row usefully freezes the outbound payload, but it stores only the latest aggregate
    state rather than an immutable exchange per attempt.  The task keeps only the first 200 response characters
    in its error, the client truncates the resulting error, and `mark_webhook_delivery_succeeded` sets
    `last_error` to null.  A transient rejection followed by acceptance therefore leaves no stored sequence
    explaining what the receiver said on each try.

    '
- id: A2-1
  author: a2-least-data-kept
  statement: 'If audgent carries Rinity calls without new deletion machinery, every completed call with
    non-empty media will retain workflow-run contexts, event logs and annotations, a structured post-call
    analysis, three WAV objects, and a transcript object for an unbounded period.

    '
  provenance:
  - EV-026
  - api/db/models.py:565
  - api/db/models.py:592
  - api/db/models.py:604
  - api/db/models.py:647
  - api/services/pipecat/event_handlers.py:292
  - api/services/pipecat/event_handlers.py:320
  - api/services/workflow_run_artifacts.py:45
  - api/tasks/workflow_completion.py:24
  stake: true
  note: 'WorkflowRunModel gives the contexts, logs, annotations, artifact locations, and public token
    a creation time but no expiry or deletion time. Completion persists the event buffer, converts mixed,
    user, and bot buffers to WAV, uploads all non-empty tracks plus a transcript, and invokes structured
    analysis for every completed run. The analysis row stores summary, caller intents, handling, policy-compliance,
    and reporting dimensions. FLOWS-001/F-2 and F-10 explicitly leave call, transcript, recording, and
    boundary-record retention unresolved; the inspected source contains no run/artifact expiry or purge
    path.

    '
- id: A2-2
  author: a2-least-data-kept
  statement: 'A process using audgent''s code defaults writes complete tool arguments and HTTP request
    bodies or query parameters to stdout at DEBUG, and the application''s seven-day retention bound does
    not apply to that stdout stream.

    '
  provenance:
  - EV-029
  - api/engine_settings.py:370
  - api/engine_settings.py:377
  - api/logging_config.py:88
  - api/logging_config.py:103
  - api/services/workflow/tools/custom_tool.py:327
  - api/services/workflow/tools/custom_tool.py:334
  - api/services/workflow/pipecat_engine_custom_tools.py:416
  - deploy/isoastra/docker-compose.staging.yaml:3
  stake: false
  note: 'The settings default is DEBUG. HTTP-tool arguments are logged at INFO and the resolved body or
    query parameters are logged at DEBUG, creating a second copy outside the per-run record. Loguru applies
    LOG_RETENTION only when LOG_FILE_PATH selects its file sink; otherwise it writes to stdout without
    an application-enforced deletion clock. The staging overlay routes container output to journald, so
    its lifetime is not bounded by the seven-day application setting. Payload-bearing log calls must be
    removed rather than assigned a longer clock.

    '
- id: A2-3
  author: a2-least-data-kept
  statement: 'The proposed boundary record is presently an unbounded raw-payload store because F-10 and
    F-11 require all provider and tool requests and responses while retention, redaction, and always-on
    versus armed capture remain explicitly undecided.

    '
  provenance:
  - EV-026
  - EV-028
  - EV-029
  - FLOWS-001-internal-reshaping.md
  - api/services/pipecat/realtime_feedback_events.py:62
  - api/services/pipecat/realtime_feedback_events.py:87
  - api/services/pipecat/event_handlers.py:292
  stake: false
  note: 'The flow names secrets and PHI inside payloads and marks retention and redaction as the largest
    open data commitment. Existing durable feedback events already retain model-supplied function arguments
    and stringified tool results in workflow_runs.logs, while EV-029 establishes that provider exchanges
    are not yet captured per run. Adding request URLs, headers, bodies, and provider responses before
    defining field-level exclusion, truncation bounds, an activation rule, and enforced expiry would multiply
    retained payload classes without a deletion contract.

    '
  rebuts:
  - A1-6
  resolution: resolved
  note_judge: 'See A1-6. A2 additionally wins B2-7 unopposed: capture is limited to boundaries rinity
    and agent tests actually exercise, not the inherited provider catalog.

    '
- id: A2-4
  author: a2-least-data-kept
  statement: 'Reading an artifact-bearing run mints a public UUID token with no expiry column or revocation
    check, so a token obtained through a later-revoked CALL_READ credential continues to expose that run''s
    recordings and transcript.

    '
  provenance:
  - DEC-001-degenerate-tenancy.md
  - api/routes/workflow.py:1250
  - api/routes/workflow.py:1264
  - api/routes/workflow.py:1274
  - api/db/models.py:615
  - api/db/workflow_run_client.py:372
  - api/db/workflow_run_client.py:406
  - api/routes/public_download.py:50
  - api/routes/public_download.py:98
  stake: false
  note: 'GET on a run creates and persists a token whenever an artifact exists, then returns unauthenticated
    public URLs containing it. The public route validates only equality with workflow_runs.public_access_token
    and issues a one-hour object-store URL; the bearer token itself has neither expires_at nor a revocation
    state and is reused forever. Under the one-organization decision, product credentials resolve into
    the same organization, so token lifetime cannot be delegated to credential lifetime.

    '
- id: A2-5
  author: a2-least-data-kept
  statement: 'For a normal recorded call, audgent persists the conversation as mixed audio, user audio,
    bot audio, a transcript file, and transcript text inside workflow-run events even though F-2 names
    only one recording and one transcript.

    '
  provenance:
  - FLOWS-001-internal-reshaping.md
  - api/services/pipecat/in_memory_buffers.py:78
  - api/services/pipecat/event_handlers.py:292
  - api/services/pipecat/event_handlers.py:320
  - api/services/workflow_run_artifacts.py:55
  - api/services/workflow_run_artifacts.py:72
  - api/services/workflow_run_artifacts.py:89
  - api/services/workflow_run_artifacts.py:110
  - api/services/pipecat/realtime_feedback_events.py:10
  stake: false
  note: 'InMemoryRecordingBuffers always maintains mixed, user, and bot tracks, and completion uploads
    every non-empty track. The same logs buffer retains final user and assistant text and then generates
    a separate transcript object from those events. This is duplication by construction: three audio representations
    and two text representations, all linked to the durable run and none assigned a deletion time.

    '
- id: A2-6
  author: a2-least-data-kept
  statement: 'Succeeded and dead-letter webhook rows retain rendered request payloads and response-derived
    error text indefinitely because terminal transitions clear only scheduling state and the schema contains
    no expiry or deletion timestamp.

    '
  provenance:
  - EV-011/AC-13
  - api/db/models.py:1046
  - api/db/models.py:1087
  - api/tasks/run_integrations.py:334
  - api/tasks/run_integrations.py:487
  - api/tasks/webhook_delivery.py:159
  - api/db/webhook_delivery_client.py:155
  - api/db/webhook_delivery_client.py:196
  stake: false
  note: 'The delivery row freezes endpoint, payload, custom headers, credential reference, status, and
    up to 2,000 characters of the last error. Templates may copy initial_context, gathered_context, annotations,
    extra data, and artifact URLs into that payload. Success and dead-letter methods set scheduled_for
    to null but do not erase payloads or establish a purge date, leaving another durable copy after network
    delivery has terminated.

    '
- id: A2-7
  author: a2-least-data-kept
  statement: 'F-5''s required before-and-after history can be represented by actor, object identifier,
    timestamp, changed field, and redacted old and new non-secret values, so retaining credential values
    or complete configuration snapshots would exceed the stated flow.

    '
  provenance:
  - EV-014
  - EV-025
  - EV-029
  - FLOWS-001-internal-reshaping.md
  - api/db/models.py:248
  - api/db/models.py:974
  stake: false
  note: 'EV-029 establishes that provider/model configuration and credentials are currently overwritten
    in place and that no general change-history model exists. EV-025 narrows the principal configuration
    decision to provider selection, while F-5 asks which agent changed what and from what to what. The
    new history schema therefore must exclude secret-bearing configuration blobs, record redaction as
    part of the event shape, and receive its own enforced expiry instead of inheriting permanent row lifetime.

    '
- id: A2-8
  author: a2-least-data-kept
  statement: 'Production-versus-agent-test cost separation requires only a bounded ledger of run identifier,
    time, origin, provider usage units, and cost, and supplies no basis for keeping audio, transcripts,
    contexts, tool payloads, or boundary bodies on the ledger''s clock.

    '
  provenance:
  - EV-013
  - FLOWS-001-internal-reshaping.md
  - api/db/models.py:604
  - api/db/models.py:605
  - api/services/pipecat/event_handlers.py:284
  stake: false
  note: 'EV-013 asks for attribution and separate rollups, and F-3 drills from those rollups by run identity.
    WorkflowRunModel already separates usage_info and cost_info from initial_context, gathered_context,
    logs, annotations, and artifacts. Retention must follow those classes separately: aggregate numeric
    spend may remain on a defined accounting clock while call content and wire content expire on their
    own shorter, explicitly enforced clocks.

    '
- id: B1-1
  author: b1-build-to-own
  statement: 'The current application can create more than one organization and therefore violates the
    one-organization invariant.

    '
  provenance:
  - EV-017
  - EV-030
  - api/db/organization_client.py:44-98
  - api/routes/auth.py:113-125
  stake: false
  note: 'The generic organization client inserts a row for every previously unseen provider id, and local
    signup derives a distinct provider id from each user before calling it. A permanent one-org implementation
    should have one idempotent bootstrap path, one fixed system organization id, authentication that only
    attaches identities to that row, removal of runtime organization creation, and startup/tests that
    fail if zero or multiple rows exist. Merely hiding the selector leaves a live path for creating state
    that whole-system reads can later omit.

    '
- id: B1-2
  author: b1-build-to-own
  statement: 'The existing owner-facing reports and usage endpoints are tenant-scoped and therefore do
    not satisfy the whole-system read contract.

    '
  provenance:
  - EV-010
  - EV-014
  - EV-030
  - api/routes/reports.py:48-69
  - api/routes/organization_usage.py:73-88
  - api/db/platform_admin_client.py:15-64
  stake: false
  note: 'Reports and usage derive a selected organization from the operator and pass it into filtered
    queries, while the unscoped platform-admin client proves that deployment-wide reads already have a
    viable home. The maintained design should make unscoped owner reads the canonical query layer for
    live calls, runs, costs, configuration, activity, and wire records; adding separate screen-specific
    tenant queries would preserve the exact plausible-but-incomplete failure mode DEC-001 identifies.

    '
- id: B1-3
  author: b1-build-to-own
  statement: 'A production-versus-agent-test split computed from the current run context is unreliable
    because caller-supplied input can overwrite its provenance fields.

    '
  provenance:
  - EV-013
  - FLOWS-001
  - api/routes/public_agent.py:229-249
  - api/db/models.py:565-632
  stake: true
  note: 'The public-agent route writes `trigger_mode`, workflow identity, and service-principal identity
    into `initial_context`, then merges the caller''s arbitrary `initial_context` over those values. `WorkflowRunModel`
    has no dedicated purpose or origin column, so one request can relabel itself and corrupt every downstream
    cost total. Run purpose must be a non-null, immutable typed field set from the authenticated product
    or agent credential at run creation, with actor/product identity in protected columns and an explicit
    unattributed value for rows whose origin is genuinely unknown.

    '
- id: B1-4
  author: b1-build-to-own
  statement: 'The current usage implementation cannot report actual spend because it records quantities
    but hard-codes reported token cost to zero and has no runtime cost-accounting path.

    '
  provenance:
  - EV-013
  - api/services/pipecat/pipeline_metrics_aggregator.py:128-151
  - api/db/organization_usage_client.py:180-221
  - api/services/workflow/run_usage_response.py:16-42
  stake: false
  note: 'The pipeline persists model-token, TTS-character, STT-duration, and call-duration quantities,
    but usage history initializes `dograh_tokens` to zero and only exposes `charge_usd` if it somehow
    already exists in `cost_info`. A durable cost subsystem needs versioned provider/model price inputs
    and immutable per-run line items containing provider, model, quantity, unit, unit price, currency,
    and calculation version; the production/test view should aggregate those line items by the protected
    run-purpose field rather than reinterpret mutable JSON on every read.

    '
- id: B1-5
  author: b1-build-to-own
  statement: 'Current provider, tool, and credential mutations erase prior values and update-actor attribution,
    so agent activity history cannot be reconstructed after the fact.

    '
  provenance:
  - EV-014
  - EV-025
  - EV-029
  - api/db/organization_configuration_client.py:35-66
  - api/db/tool_client.py:139-206
  - api/db/webhook_credential_client.py:102-174
  stake: false
  note: 'Provider configuration is overwritten in place, and tool and credential updates retain only the
    latest row plus a timestamp; none records who performed an update or the replaced value. The maintainable
    implementation is an append-only configuration-change record written in the same transaction as every
    mutation, with resource type and stable id, operation, redacted before/after snapshots, actor kind
    and id, agent session/correlation id, and timestamp. That requires shared mutation services with caller
    context rather than audit calls sprinkled through UI and MCP handlers, because independently committed
    audit rows will eventually disagree with live state.

    '
- id: B1-6
  author: b1-build-to-own
  statement: 'The current MCP server cannot serve as the primary worker-agent interface because it accepts
    only operator session tokens and exposes neither workflow/provider testing nor run diagnosis.

    '
  provenance:
  - EV-006
  - EV-011
  - EV-028
  - api/mcp_server/auth.py:8-38
  - api/mcp_server/server.py:1-49
  stake: false
  note: 'MCP authentication resolves every invocation to a human `UserModel`, so agent-authored changes
    are attributed to the owner, and the registered tool list is centered on workflow creation/editing
    and catalog reads. There are no tools for testing a workflow, configuring or testing a provider, reading
    a run, or querying boundary records. Worker agents need first-class service-principal identity and
    scoped capabilities, while MCP and REST should remain thin adapters over the same domain services
    so validation, auditing, verdicts, and authorization cannot drift by interface.

    '
- id: B1-7
  author: b1-build-to-own
  statement: 'The current logging and tracing paths cannot provide complete per-run wire records with
    enforceable redaction and retention.

    '
  provenance:
  - EV-026
  - EV-029
  - api/services/workflow/tools/custom_tool.py:292-349
  - api/services/pipecat/realtime_feedback_events.py:87-107
  - api/services/pipecat/tracing_config.py:141-181
  - api/engine_settings.py:351-377
  stake: false
  note: 'Tool requests send method, URL, headers, body, and parameters, but only the body and parameters
    go to a DEBUG process log; the persisted function result is converted to an opaque string. Provider
    exchanges depend on optional exporters, and the tracing exporter explicitly allows spans with no destination
    to be dropped. Wire diagnosis should use a dedicated ordered boundary-exchange model keyed by run
    and turn, with boundary kind, provider/tool identity, request and response metadata, status, timing,
    payload references, truncation/hash markers, redaction-policy version, and expiry. Large bodies belong
    in controlled object storage rather than a growing run JSON document, and both owner and agent APIs
    should query the same record. The existing DEBUG body logging should be removed when deliberate capture
    lands so there is one governed copy rather than a second accidental one.

    '
- id: B1-8
  author: b1-build-to-own
  statement: 'The repository remains architecturally self-contradictory while contributor instructions
    mandate organization-scoped reads and primary documentation presents a generic self-service platform.

    '
  provenance:
  - EV-001
  - EV-017
  - EV-027
  - api/AGENTS.md:58-72
  - README.md:1-83
  - api/app.py:70-75
  - api/mcp_server/instructions.py:24-66
  stake: false
  note: 'Coding agents are explicitly told that every organization-scoped read must filter by the selected
