services:
  aws-credentials:
    image: public.ecr.aws/rolesanywhere/credential-helper@sha256:d06f1c35dd683d6f67c950fec3e39b3599bca5471acf05d8554650299d1029d7
    container_name: ronitnath-aws-credentials
    restart: unless-stopped
    network_mode: host
    user: '0:0'
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - /data/crypt/ronitnath/aws:/identity:ro
    command:
      - serve
      - --certificate
      - /identity/certificate.pem
      - --private-key
      - /identity/private-key.pem
      - --role-arn
      - arn:aws:iam::997053010525:role/ronitnath-privacy-prod
      - --trust-anchor-arn
      - arn:aws:rolesanywhere:us-west-1:997053010525:trust-anchor/68e06e03-2974-46d1-b0b4-a51b6707c56d
      - --profile-arn
      - arn:aws:rolesanywhere:us-west-1:997053010525:profile/37321339-6c80-4526-a3ee-178b838613fa
      - --region
      - us-west-1
      - --port
      - '9911'

  web:
    image: ${IMAGE:-ghcr.io/ronitnath/ronitnath-app:${TAG}}
    container_name: ronitnath-web
    restart: unless-stopped
    network_mode: host
    env_file: /data/crypt/ronitnath/web.env
    environment:
      PORT: '3140'
      APP_VERSION: ${APP_VERSION:-${TAG}}
      AWS_REGION: us-west-1
      AWS_EC2_METADATA_SERVICE_ENDPOINT: http://127.0.0.1:9911
      AWS_EC2_METADATA_V1_DISABLED: 'true'
      PRIVACY_KMS_KEY_ID: alias/isoastra/ronitnath/privacy/prod
    depends_on:
      - aws-credentials
