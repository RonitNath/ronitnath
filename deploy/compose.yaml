name: rn-site

# One identical Compose model on all three hosts. Everything host-specific is in
# the root-owned env files beside it:
#
#   image.env    RN_SITE_IMAGE=<digest>            (rewritten by the deploy role)
#   node.env     node identity, mesh IP, full Hiqlite peer map
#   ../secrets/  shared Hiqlite Raft/API secrets (provisioned, never by CD)
#
# The complete Hiqlite state directory is a persistent host bind. The model is
# still identical on every host: only stable node identity differs, and only the
# immutable image digest changes during a routine rollout.
#
# `env_file:` injects variables into the *container* and is invisible to Compose
# interpolation, so resolving ${RN_SITE_IMAGE} and ${MESH_IP} in the model below
# needs `--env-file` on the command line as well. Both are required and they are
# deliberately not the same mechanism.

services:
  site:
    image: ${RN_SITE_IMAGE:?Set RN_SITE_IMAGE to an immutable forge registry digest}
    user: "9751:9751"
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.5
    # Hiqlite deliberately drains a multi-node voter before stopping. Ten
    # seconds races that drain and turns normal deploys into auto-heal boots.
    stop_grace_period: 30s
    tmpfs:
      - /tmp:size=32m,mode=1777
    env_file:
      - ./image.env
      - ./node.env
    environment:
      RUST_LOG: info
      RN_SITE__MODE: prod
      RN_SITE__DB_PATH: /var/lib/rn-site/db.sqlite
      RN_SITE_HQL_SECRET_RAFT_FILE: /run/secrets/hiqlite_raft
      RN_SITE_HQL_SECRET_API_FILE: /run/secrets/hiqlite_api
      # The AES-128 key every public id is derived from. It is not a session
      # secret and it is not rotatable: a public_id is the ciphertext of
      # `table_tag ‖ rowid` under this key, computed on read and stored in no
      # column, so a new key silently renames every object in the deployment —
      # every bookmarked URL, every invitation link, every id anyone pasted
      # anywhere. It is provisioned once alongside the two Hiqlite secrets and
      # then left alone; see deploy/CUTOVER.md for the one time it is minted.
      #
      # `_FILE` is the same contract the two Hiqlite secrets use: the value is
      # never an environment variable, because a container's environment is
      # readable by anything that can inspect it and shows up in every crash
      # dump. The server reads the file at boot.
      RN_SITE__ID_KEY_FILE: /run/secrets/id_key
      # The first platform operator, on the one node that is asked to take it.
      # `bootstrap-operator` cannot run against a formed cluster — hiqlite locks
      # its data directory, so the subcommand and the serving voter cannot both
      # have it — so the serving process does it instead: when the address below
      # registers and this deployment has no operator yet, it writes
      # `platform:* #operator @person`. The kernel refuses a second one, so this
      # is safe to leave set and does nothing on every boot after the first.
      #
      # Set it in *nexus's* node.env, not here, and on one node only; see
      # deploy/CUTOVER.md §6.
      #
      #   RN_SITE__BOOTSTRAP_OPERATOR_EMAIL: you@example.com
    volumes:
      - type: bind
        source: ../state
        target: /var/lib/rn-site
        bind:
          create_host_path: false
    secrets:
      - hiqlite_raft
      - hiqlite_api
      - id_key
    ports:
      # Public HTTP, reachable only from nanode's Caddy over the mesh. Bound to
      # the node's mesh IP, never 0.0.0.0 — which is also why every health gate
      # must curl ${MESH_IP} and not 127.0.0.1.
      - target: 3160
        published: "3160"
        host_ip: ${MESH_IP:?Set MESH_IP in node.env}
        protocol: tcp
      # Raft and the Hiqlite API are peer-only. Binding to the mesh address
      # keeps them off every public/LAN interface; host ACLs still restrict the
      # callers to the other two rn-site nodes.
      - target: 8100
        published: "8100"
        host_ip: ${MESH_IP:?Set MESH_IP in node.env}
        protocol: tcp
      - target: 8200
        published: "8200"
        host_ip: ${MESH_IP:?Set MESH_IP in node.env}
        protocol: tcp
    healthcheck:
      # Liveness, not readiness: Compose must not restart a container for a
      # reason readiness would merely report. The deploy role gates on /readyz
      # separately. This one curls loopback *inside* the container, where the
      # listener is bound to 0.0.0.0 — the mesh-IP caveat above is about gates
      # running on the host.
      test: [CMD, curl, -fsS, -o, /dev/null, "http://127.0.0.1:3160/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s

secrets:
  hiqlite_raft:
    file: ../secrets/hiqlite-raft
  hiqlite_api:
    file: ../secrets/hiqlite-api
  id_key:
    file: ../secrets/id-key
