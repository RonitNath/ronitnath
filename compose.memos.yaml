services:
  db:
    image: postgres:17
    container_name: ronitnath-memos-db
    restart: unless-stopped
    ports:
      - '127.0.0.1:55433:5432'
    environment:
      POSTGRES_USER: ronitnath
      POSTGRES_PASSWORD: ronitnath
      POSTGRES_DB: ronitnath
    volumes:
      - memos-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ronitnath -d ronitnath']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  memos-db:
