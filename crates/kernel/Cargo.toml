[package]
name = "rn-kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rn-api = { workspace = true }

# Storage. hiqlite is the production engine; rusqlite is the *same* SQLite
# running in-process, used by tests and benches so they exercise the real
# statements rather than a stand-in for them.
hiqlite = { workspace = true }
rusqlite = { workspace = true }
rust-embed = { workspace = true }

# Crypto.
aes = { workspace = true }
argon2 = { workspace = true }
base64 = { workspace = true }
getrandom = { workspace = true }
sha2 = { workspace = true }

# Shared.
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
criterion = { workspace = true, features = ["async_tokio"] }
proptest = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "kernel"
harness = false
