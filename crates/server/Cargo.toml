[package]
name = "rn-site"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "rn-site"
path = "src/main.rs"

[lib]
name = "rn_site"
path = "src/lib.rs"

[dependencies]
rn-api = { workspace = true }
rn-kernel = { workspace = true }
axum = { workspace = true }
futures-util = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
askama = { workspace = true }
askama_web = { workspace = true }
rust-embed = { workspace = true }
hiqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
config = { workspace = true }
dotenvy = { workspace = true }
thiserror = { workspace = true }
# The token endpoint decodes an `Authorization: Basic` credential, and the
# back-channel logout task needs a `jti`. Both are already in the graph.
base64 = { workspace = true }
getrandom = { workspace = true }

[dev-dependencies]
axum-test = { workspace = true }
# Signing a logout token by hand, to assert its claims. Test-only: the server
# never generates a key — `rotate-signing-key` does, in the kernel.
rsa = { workspace = true }
rand_core = { workspace = true }
tempfile = { workspace = true }
futures-util = { workspace = true }
