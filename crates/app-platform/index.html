<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>platform</title>
    <script>
      // The stored theme is applied before first paint; the shell keeps it in
      // step afterwards. Without this a reader whose choice differs from their
      // system setting sees one frame of the other palette.
      try {
        var t = localStorage.getItem("rn-theme");
        if (t) document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <link data-trunk rel="css" href="../ui/tokens.css" />
    <link data-trunk rel="css" href="platform.css" />
    <link data-trunk rel="rust" data-bin="rn-platform" data-cargo-profile="wasm-release" />
  </head>
  <body></body>
</html>
