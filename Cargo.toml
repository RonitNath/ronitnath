[package]
name = "rn-site"
version = "0.1.0"
edition = "2024"
default-run = "rn-site"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rn-site"
path = "src/main.rs"
required-features = ["ssr"]

[dependencies]
leptos = { version = "0.9.0-beta", features = ["islands"] }
leptos_router = { version = "0.9.0-beta1" }
leptos_meta = { version = "0.9.0-beta" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.145", optional = true }
axum = { version = "0.8.9", optional = true }
console_error_panic_hook = { version = "0.1.7", optional = true }
leptos_axum = { version = "0.9.0-beta", optional = true }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "signal", "macros"], optional = true }
wasm-bindgen = { version = "0.2.126", optional = true }
wasm-bindgen-futures = { version = "0.4.76", optional = true }
js-sys = { version = "0.3.103", optional = true }
web-sys = { version = "0.3.103", optional = true, features = [
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlDivElement",
    "HtmlScriptElement",
    "HtmlHeadElement",
    "WebGl2RenderingContext",
    "WebGlProgram",
    "WebGlShader",
    "WebGlBuffer",
    "WebGlTexture",
    "WebGlUniformLocation",
    "Blob",
    "ImageBitmap",
    "Response",
    "Request",
    "RequestInit",
    "RequestMode",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "ReadableStreamReadResult",
    "Window",
    "Document",
    "Location",
    "VisibilityState",
    "Element",
    "DomTokenList",
    "Event",
    "EventTarget",
    "MediaQueryList",
    "Storage",
    "console",
] }

# SSR auth / data plane
hiqlite = { version = "0.14", optional = true, default-features = false, features = [
    "sqlite",
    "auto-heal",
    "cache",
    "macros",
    "toml",
    # backup omitted for self-contained `cargo run` (needs S3 + EncKeys).
    # shutdown-handle omitted — we own Ctrl+C / SIGTERM in operations::shutdown.
] }
argon2 = { version = "0.5", optional = true }
uuid = { version = "1", optional = true, features = ["v4", "serde"] }
rust-embed = { version = "8", optional = true }
tracing = { version = "0.1", optional = true, features = ["attributes"] }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter"] }
tower-http = { version = "0.6", optional = true, features = ["trace"] }
config = { version = "0.15", optional = true }
clap = { version = "4", optional = true, features = ["derive"] }
thiserror = { version = "2", optional = true }
rusqlite = { version = "0.40", optional = true, features = ["bundled"] }
hex = { version = "0.4", optional = true }
sha2 = { version = "0.11.0", optional = true }

[features]
default = ["ssr"]
hydrate = [
    "leptos/hydrate",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:web-sys",
]
ssr = [
    "dep:axum",
    "dep:serde_json",
    "dep:tokio",
    "dep:leptos_axum",
    "dep:hiqlite",
    "dep:argon2",
    "dep:uuid",
    "dep:rust-embed",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:tower-http",
    "dep:config",
    "dep:clap",
    "dep:thiserror",
    "dep:rusqlite",
    "dep:hex",
    "dep:sha2",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]
# Pulls hiqlite's query UI. Never enable on the public edge / release image.
dev-dashboard = ["ssr", "hiqlite/dashboard"]

[dev-dependencies]
axum-test = "21.0.0"
libc = "0.2.189"
tempfile = "3"

[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.leptos]
output-name = "rn-site"
site-root = "target/site"
site-pkg-dir = "pkg"
tailwind-input-file = "style/tailwind.css"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
end2end-cmd = "npx playwright test"
end2end-dir = "end2end"
browserquery = "defaults"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
js-dir = "public/js"
