[workspace]

[package]
name = "ronitnath"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[dependencies]
axum = "=0.8.9"
http-runtime = { git = "https://git.isoastra.com/ronitnath/web_template.git", rev = "48c1517d72b1fdcd5ad3f59a3e83ef3cf9c362cf", version = "=0.6.0" }
islands = { git = "https://git.isoastra.com/ronitnath/web_template.git", rev = "48c1517d72b1fdcd5ad3f59a3e83ef3cf9c362cf", version = "=0.6.0" }
serde_json = "=1.0.150"
telemetry = { git = "https://git.isoastra.com/ronitnath/web_template.git", rev = "48c1517d72b1fdcd5ad3f59a3e83ef3cf9c362cf", version = "=0.6.0" }
tokio = { version = "=1.52.3", features = ["macros", "net", "rt-multi-thread", "signal"] }

[dev-dependencies]
tempfile = "=3.27.0"
tower = { version = "=0.5.3", features = ["util"] }

# Shallow changes must redeploy in seconds (owner ruling 2026-07-14), so
# release builds keep incremental codegen.
[profile.release]
incremental = true
