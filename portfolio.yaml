# Product index. One entry per product under management.
# tier: experiment | real | client-facing   (see README — ceremony scales with tier)
# status: discovery | betting | building | live | dormant
products:
  - name: ronitnath-universe
    tier: real
    status: discovery
    summary: Greenfield personal-universe platform (Rust/Leptos). Current bet in discovery: events platform + identity model.
    code_repo: RonitNath/universe-ronitnath (private GitHub); live predecessor RonitNath/ronitnath
    context: ~/dev/context/ronitnath/platform-scope.md
  - name: rinity
    tier: real
    status: discovery
    summary: >-
      Healthcare voice-agent SaaS, the Isoastra flagship (only pushed brand). Brownfield onboard
      2026-08-06: continue the existing codebase, extract its feature surface, then first-principles
      PM from evidence (EV-007). Audgent engine is the expected voice-stack target and in design
      scope (EV-008); nothing in the codebase is sacred (EV-009). Promote to client-facing at
      first external deploy (RCDA pilot).
    code_repo: isoastra/rinity on the forge (control plane; nexus ~/dev/isoastra/rinity); engine isoastra/audgent + isoastra/pipecat
    context: ~/dev/context/isoastra/business-direction.md, ~/dev/context/isoastra/products-history-20260724.md
  - name: audgent
    tier: real
    status: discovery
    summary: >-
      Interim production voice engine under the front desk service (rinity), held until the
      greenfield `voice` product replaces it (EV-007). Brownfield onboard 2026-08-06 on a
      direction change: stop being a self-hostable vapi/retell alternative (EV-001), degenerate
      to one organization with product-level auth keys (EV-017), give the owner observability
      onto the whole system rather than one workspace (EV-010, EV-014), make worker agents the
      authoring/testing surface with configuration as agent work (EV-011, EV-012), separate
      agent-test cost from production (EV-013), and add phonetic misrecognition repair on
      pipecat frames (EV-015, EV-016). Modified in place, never rebuilt (EV-018). Two bets:
      bet 1 = the reshaping (BRIEF-001), bet 2 = phonetics (EV-022). Bound explicitly waived
      (EV-020), so EV-021 is the only scope control; disposal needs a hardened, production-tested
      `voice` and is not near (EV-023). Capability inventory of the as-built engine is
      rinity/EV-011.
    code_repo: isoastra/audgent on the forge (nexus ~/dev/isoastra/audgent) + isoastra/pipecat submodule
    context: ~/dev/context/isoastra/products-history-20260724.md, ~/dev/context/isoastra/business-direction.md
  - name: voice
    tier: real
    status: betting
    summary: >-
      voice.ronitnath.com — greenfield Rust voice-agent orchestration service, the intended
      replacement for audgent. Onboarded 2026-08-06: voice agents are a baseline product in
      their own right (EV-001); audgent is disqualified on language (EV-002), on missing
      systems critical to quality orchestration (EV-003), and on provenance — a dograh fork
      repurposed for Isoastra rather than designed for it (EV-004). Built incrementally from
      the basics so the owner can judge each component (EV-005), on the ronitnath domain as
      the testing-mode signal (EV-006), graduating to Isoastra on an owner verdict about the
      internals (EV-007). Stack is ruled: same as ronitnath-universe (EV-008). Interviewed
      2026-08-06 (BRIEF-001): the shape is a ladder — accept/store/replay audio, then
      segmentation + STT with scrubbable transcript-aligned replay and word-level timing,
      then an LLM turn, then TTS last (EV-014..020); above it multi-LLM latency cover, a
      conversation supervisor / sanity check, phonetic repair, diarization, injection
      defense and cost accounting (EV-021..027). Web only, no telephony (EV-028). console is
      discarded outright, not harvested (EV-009, EV-011). Bound waived (EV-030), so ladder
      order is the only scope control. DEBATE-001 settled the measurement model (DEC-002);
      PITCH-001 frozen at tag pitch/voice-1 covering rungs 1-4, intelligence layer is bet 2.
      Next: work packets for rung 1, then design + data gates.
    code_repo: none yet — greenfield; console is explicitly NOT prior art (EV-011)
    context: ~/dev/context/ronitnath/platform-scope.md, ~/dev/context/isoastra/business-direction.md
  - name: isoastra-services
    tier: real
    status: discovery
    summary: >-
      services.isoastra.com — HA hiqlite-backed central point for internal services, on the
      universe-ronitnath stack (Rust/Leptos islands/Axum/hiqlite). Absorbs the ingress-controller
      rebuild handoff (2026-08-06) and widens it: takes over ingress-ctl (routing), the mailer
      (mailing), and later service-gateway. T1 scope is routing + mailing only (EV-005). RBAC from
      day one; principals today are the owner and agents, employee roles deferred (EV-004). The
      live nanode daemon + ingress-ctl stay canonical until cutover (EV-009).
    code_repo: none yet — greenfield; prior art Isoastra/service-ingress, isoastra/mailer, Isoastra/service-gateway
    context: ~/dev/context/resources/networks.md (ingress-ctl), ~/dev/context/procedures/ha-service.md, ~/dev/context/resources/mail-fabric.md
# Other products (frontdesk-dental, rcda-mail, …) onboard when they are next touched,
# each with an explicit tier — corner-cutting is deliberate, not accidental.
