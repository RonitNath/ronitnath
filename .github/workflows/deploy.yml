# Generated by @isoastra/fleet-delivery 0.3.7; validate with fleet-delivery workflow-check.
name: deploy
on:
  push:
    branches: ['deploy', 'staging', 'preview/**']
permissions:
  contents: read
  packages: write
concurrency:
  group: ronitnath-production-${{ github.ref_name }}
  cancel-in-progress: false
env:
  DOCKER_HOST: 'unix:///run/user/2101/docker.sock'
  XDG_RUNTIME_DIR: '/run/user/2101'
jobs:
  observe:
    if: github.ref_name == 'deploy' || github.ref_name == 'staging'
    runs-on: ['self-hosted', 'ronitnath-delivery', 'delenda']
    environment: ${{ github.ref_name == 'deploy' && 'production' || 'staging' }}
    steps:
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with: { version: 10.28.1 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.13.0
          registry-url: https://npm.pkg.github.com
          scope: '@isoastra'
      - run: install -m 600 /dev/null "$RUNNER_TEMP/status-key" && install -m 600 /dev/null "$RUNNER_TEMP/known-hosts" && printf '%s\n' "$STATUS_SSH_KEY" > "$RUNNER_TEMP/status-key" && printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/known-hosts"
        env: { STATUS_SSH_KEY: "${{ secrets.DELIVERY_STATUS_SSH_KEY }}", KNOWN_HOSTS: "${{ secrets.DELIVERY_KNOWN_HOSTS }}" }
      - run: pnpm dlx --package=@isoastra/fleet-delivery@0.3.7 fleet-delivery host-status current > baseline.json
        env: { NODE_AUTH_TOKEN: "${{ secrets.FLEET_PACKAGES_TOKEN }}", DELIVERY_COORDINATOR_HOST: "${{ secrets.DELIVERY_COORDINATOR_HOST }}", DELIVERY_SSH_USER: "delivery-status", DELIVERY_SSH_KEY_PATH: "${{ runner.temp }}/status-key", DELIVERY_KNOWN_HOSTS_PATH: "${{ runner.temp }}/known-hosts" }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: { name: production-baseline, path: baseline.json, retention-days: 1 }
  validate:
    needs: observe
    if: always() && (needs.observe.result == 'success' || startsWith(github.ref_name, 'preview/'))
    runs-on: ['self-hosted', 'ronitnath-delivery', 'delenda']
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with: { version: 10.28.1 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.13.0
          registry-url: https://npm.pkg.github.com
          scope: '@isoastra'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: ${{ !startsWith(github.ref_name, 'preview/') }}
        with: { name: production-baseline, path: .delivery }
      - run: pnpm install --frozen-lockfile
        env: { NODE_AUTH_TOKEN: "${{ secrets.FLEET_PACKAGES_TOKEN }}" }
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ github.token }}"
      - if: startsWith(github.ref_name, 'preview/')
        run: pnpm exec fleet-delivery run delivery.preview.json
        env: { GITHUB_SHA: "${{ github.sha }}", GITHUB_TOKEN: "${{ github.token }}", FLEET_PACKAGES_TOKEN: "${{ secrets.FLEET_PACKAGES_TOKEN }}", DELIVERY_INGEST_TOKEN: "${{ secrets.DELIVERY_INGEST_TOKEN }}", DELIVERY_TELEMETRY_URL: "https://ronitnath.com/api/delivery/events" }
      - if: github.ref_name == 'staging'
        run: pnpm exec fleet-delivery run delivery.staging.json
        env: { GITHUB_SHA: "${{ github.sha }}", GITHUB_TOKEN: "${{ github.token }}", FLEET_PACKAGES_TOKEN: "${{ secrets.FLEET_PACKAGES_TOKEN }}", DELIVERY_INGEST_TOKEN: "${{ secrets.DELIVERY_INGEST_TOKEN }}", DELIVERY_TELEMETRY_URL: "https://ronitnath.com/api/delivery/events" }
      - if: github.ref_name == 'deploy'
        run: pnpm exec fleet-delivery run delivery.pipeline.json
        env: { GITHUB_SHA: "${{ github.sha }}", GITHUB_TOKEN: "${{ github.token }}", FLEET_PACKAGES_TOKEN: "${{ secrets.FLEET_PACKAGES_TOKEN }}", DELIVERY_INGEST_TOKEN: "${{ secrets.DELIVERY_INGEST_TOKEN }}", DELIVERY_TELEMETRY_URL: "https://ronitnath.com/api/delivery/events" }
      - if: always()
        run: pnpm delivery:cleanup
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "delivery-${{ github.sha }}"
          path: .delivery/
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
  environment:
    needs: validate
    if: startsWith(github.ref_name, 'preview/') || github.ref_name == 'staging'
    runs-on: ['self-hosted', 'ronitnath-delivery', 'delenda']
    environment: ${{ startsWith(github.ref_name, 'preview/') && 'preview' || 'staging' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with: { version: 10.28.1 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.13.0
          registry-url: https://npm.pkg.github.com
          scope: '@isoastra'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: "delivery-${{ github.sha }}"
          path: .delivery
      - run: pnpm install --frozen-lockfile
        env: { NODE_AUTH_TOKEN: "${{ secrets.FLEET_PACKAGES_TOKEN }}" }
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ github.token }}"
      - run: pnpm run delivery:environment -- --profile "${{ startsWith(github.ref_name, 'preview/') && 'preview' || 'staging' }}"
        env: { GITHUB_SHA: "${{ github.sha }}", FLEET_PACKAGES_TOKEN: "${{ secrets.FLEET_PACKAGES_TOKEN }}", DELIVERY_INGEST_TOKEN: "${{ secrets.DELIVERY_INGEST_TOKEN }}", DELIVERY_TELEMETRY_URL: "https://ronitnath.com/api/delivery/events", ENVIRONMENT_INGRESS_TOKEN: "${{ secrets.ENVIRONMENT_INGRESS_TOKEN }}" }
  production:
    needs: validate
    if: github.ref_name == 'deploy'
    runs-on: ['self-hosted', 'ronitnath-delivery', 'delenda']
    environment: production
    steps:
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with: { version: 10.28.1 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.13.0
          registry-url: https://npm.pkg.github.com
          scope: '@isoastra'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: "delivery-${{ github.sha }}"
          path: .delivery
      - run: pnpm dlx --package=@isoastra/fleet-delivery@0.3.7 fleet-delivery telemetry-flush .delivery/telemetry-buffer.jsonl
        env: { NODE_AUTH_TOKEN: "${{ secrets.FLEET_PACKAGES_TOKEN }}", DELIVERY_INGEST_TOKEN: "${{ secrets.DELIVERY_INGEST_TOKEN }}", DELIVERY_TELEMETRY_URL: "https://ronitnath.com/api/delivery/events" }
      - run: install -m 600 /dev/null "$RUNNER_TEMP/deploy-key" && install -m 600 /dev/null "$RUNNER_TEMP/known-hosts" && printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy-key" && printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/known-hosts"
        env: { DEPLOY_SSH_KEY: "${{ secrets.DEPLOY_SSH_KEY }}", KNOWN_HOSTS: "${{ secrets.DELIVERY_KNOWN_HOSTS }}" }
      - run: pnpm dlx --package=@isoastra/fleet-delivery@0.3.7 fleet-delivery submit .delivery/release.json
        env: { NODE_AUTH_TOKEN: "${{ secrets.FLEET_PACKAGES_TOKEN }}", DELIVERY_COORDINATOR_HOST: "${{ secrets.DELIVERY_COORDINATOR_HOST }}", DELIVERY_SSH_USER: "delivery-submit", DELIVERY_SSH_KEY_PATH: "${{ runner.temp }}/deploy-key", DELIVERY_KNOWN_HOSTS_PATH: "${{ runner.temp }}/known-hosts" }
      - if: always()
        run: truncate -s 0 "$RUNNER_TEMP/deploy-key" "$RUNNER_TEMP/known-hosts" 2>/dev/null || true
