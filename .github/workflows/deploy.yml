# Generated by @isoastra/fleet-delivery 0.1.0; validate with fleet-delivery workflow-check.
name: deploy
on:
  push:
    branches: [deploy]
permissions:
  contents: read
  packages: write
concurrency:
  group: ronitnath-production
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ['self-hosted', 'ronitnath-delivery', 'delenda']
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.28.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.FLEET_PACKAGES_TOKEN }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: mkdir -p .delivery
      - run: flock /run/fleet-admission/heavy.lock pnpm exec fleet-delivery run delivery.pipeline.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FLEET_PACKAGES_TOKEN: ${{ secrets.FLEET_PACKAGES_TOKEN }}
          DELIVERY_INGEST_TOKEN: ${{ secrets.DELIVERY_INGEST_TOKEN }}
          DELIVERY_TELEMETRY_URL: https://ronitnath.com/api/delivery/events
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      - if: always()
        run: pnpm delivery:cleanup
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: delivery-${{ github.sha }}
          path: .delivery/
          if-no-files-found: error
          retention-days: 30
